global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Self-monitoring cua Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Thu thap metrics cua ung dung web Recipe (nginx stub_status)
  - job_name: "recipe-web"
    metrics_path: "/stub_status"
    static_configs:
      - targets: ["recipe-web:8080"]
        labels:
          service: "recipe-web"

  # Thu thap metrics cua Nginx Reverse Proxy
  - job_name: "nginx-proxy"
    metrics_path: "/stub_status"
    static_configs:
      - targets: ["nginx-proxy:80"]
        labels:
          service: "nginx-proxy"

  # Thu thap metrics cua MySQL database
  - job_name: "mysql"
    static_configs:
      - targets: ["recipe-mysql-exporter:9104"]
        labels:
          service: "mysql"
