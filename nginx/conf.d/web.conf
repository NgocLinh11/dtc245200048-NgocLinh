server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Rut trang / dat index.html lam trang chu
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prometheus stub_status de thu thap metrics
    location = /stub_status {
        stub_status;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # Static files co the cach trung
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf) {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
