services:
  # Service ứng dụng web: Website Công thức Nấu ăn (Recipe)
  web:
    build: .
    container_name: recipe-web
    restart: unless-stopped
    volumes:
      - ./nginx/conf.d/web.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend

  # Nginx Reverse Proxy làm gateway, lắng nghe port 80/443, proxy sang recipe-web
  nginx-proxy:
    image: nginx:1.27-alpine
    container_name: recipe-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - frontend
      - backend

  # Cơ sở dữ liệu MySQL + công cụ quản lý DB (phpMyAdmin)
  db:
    image: mysql:8.0
    container_name: recipe-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: recipe-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 512M
    ports:
      - "8081:80"
    networks:
      - backend

  # Prometheus + Grafana + Loki + Promtail (hệ thống giám sát và log)
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: recipe-mysql-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: root:${MYSQL_ROOT_PASSWORD}@tcp(db:3306)/${MYSQL_DATABASE}?parseTime=true
    depends_on:
      - db
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: recipe-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: recipe-grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - backend

  loki:
    image: grafana/loki:2.9.8
    container_name: recipe-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./monitoring/loki:/etc/loki:ro
      - loki_data:/loki
    networks:
      - backend

  promtail:
    image: grafana/promtail:latest
    container_name: recipe-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./monitoring/promtail:/etc/promtail:ro
      - promtail_data:/tmp
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:
